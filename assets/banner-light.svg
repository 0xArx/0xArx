<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Abdulrahman Shahzad, AI engineer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eaf0fa"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3457e0"/><stop offset="1" stop-color="#0a9e7f"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3457e0" stop-opacity="0.28"/><stop offset="1" stop-color="#3457e0" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dde5f1" stroke-width="1"/></pattern>
<mask id="fade"><linearGradient id="fg" x1="0" x2="1"><stop offset="0.35" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><rect width="1200" height="300" fill="url(#fg)"/></mask>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.e{stroke:url(#acc);stroke-width:1.6;fill:none;stroke-dasharray:6 8;animation:flow 3.2s linear infinite}
.n{fill:#f7f9fc;stroke:#3457e0;stroke-width:2}
.p{fill:#0a9e7f;animation:pulse 2.4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-56}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.e,.p{animation:none}}
</style>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<rect width="1200" height="300" rx="18" fill="url(#grid)" mask="url(#fade)" opacity="0.9"/>
<circle cx="930" cy="150" r="190" fill="url(#glow)"/>
<g>
<path class="e" d="M930 150 L820 78"/><path class="e" d="M930 150 L1060 70"/><path class="e" d="M930 150 L800 222"/><path class="e" d="M930 150 L1075 215"/><path class="e" d="M930 150 L955 40"/><path class="e" d="M820 78 L955 40"/><path class="e" d="M1060 70 L1075 215"/>
<circle class="n" cx="820" cy="78" r="9"/><circle class="n" cx="1060" cy="70" r="9"/><circle class="n" cx="800" cy="222" r="9"/><circle class="n" cx="1075" cy="215" r="9"/><circle class="n" cx="955" cy="40" r="7"/>
<circle cx="930" cy="150" r="30" fill="#f7f9fc" stroke="url(#acc)" stroke-width="2.5"/>
<text x="930" y="157" text-anchor="middle" class="m" font-size="20" font-weight="700" fill="#0f1726">0x</text>
<circle class="p" cx="820" cy="78" r="3.5"/><circle class="p" cx="1075" cy="215" r="3.5" style="animation-delay:.8s"/><circle class="p" cx="800" cy="222" r="3.5" style="animation-delay:1.6s"/>
</g>
<text x="64" y="118" class="t" font-size="50" font-weight="700" fill="#0f1726" letter-spacing="-1">Abdulrahman Shahzad</text>
<text x="66" y="162" class="t" font-size="22" fill="#506078">AI engineer building agents that take real actions,</text>
<text x="66" y="192" class="t" font-size="22" fill="#506078">and the guardrails that keep them honest.</text>
<rect x="66" y="222" width="72" height="4" rx="2" fill="url(#acc)"/>
<text x="156" y="229" class="m" font-size="15" fill="#506078">agents · voice AI · ML · AI security · Mac + iOS</text>
</svg>
